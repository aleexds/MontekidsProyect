<!DOCTYPE html>
<html lang="es" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Montekids - Plataforma Educativa y Estimulación Temprana</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#006971",
              "primary-container": "#00dbeb", // Cyan vibrante Montekids
              "on-primary-container": "#005c63",
              "secondary": "#855400",
              "secondary-container": "#ffa71a", // Orange vibrante Montekids
              "tertiary": "#b70072", // Magenta Montekids
              "tertiary-container": "#f5009b",
              "indigo-montekids": "#4e00de", // Deep Indigo Montekids
              "purple-montekids": "#a323d1", // Purple Montekids
              "background": "#fdf8ff",
              "surface": "#fdf8ff",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f7f1ff",
              "surface-container-high": "#ece4ff",
              "on-surface": "#1d1149",
              "on-surface-variant": "#3b494b"
            },
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"]
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-background font-sans text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
