<!DOCTYPE html>
<html lang="es" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Montekids - Plataforma Educativa y Estimulación Temprana</title>
    
    <!-- Google Fonts: Nunito (para títulos) & Plus Jakarta Sans (para cuerpo) + Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <!-- Cargar Google Material Symbols Outlined -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#006971",
              "primary-container": "#00dbeb",
              "on-primary-container": "#005c63",
              "secondary": "#855400",
              "secondary-container": "#ffa71a",
              "tertiary": "#b70072",
              "tertiary-container": "#f5009b",
              "indigo-montekids": "#4e00de",
              "purple-montekids": "#a323d1",
              "background": "var(--bg-main)",
              "surface": "var(--bg-main)",
              "surface-container-lowest": "var(--bg-surface-lowest)",
              "surface-container-low": "var(--bg-surface-low)",
              "surface-container-high": "var(--bg-surface-high)",
              "on-surface": "var(--text-main)",
              "on-surface-variant": "var(--text-variant)"
            },
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"],
              heading: ["Nunito", "sans-serif"]
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-background font-sans text-on-surface antialiased transition-colors duration-300">
    <div id="root"></div>

    <!-- Filtros SVG de accesibilidad para Daltonismo -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
      <defs>
        <!-- Protanopia: Deficiencia cono rojo -->
        <filter id="protanopia" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.567, 0.433, 0,     0, 0
                                               0.558, 0.442, 0,     0, 0
                                               0,     0.242, 0.758, 0, 0
                                               0,     0,     0,     1, 0" />
        </filter>
        <!-- Deuteranopia: Deficiencia cono verde -->
        <filter id="deuteranopia" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.625, 0.375, 0,   0, 0
                                               0.7,   0.3,   0,   0, 0
                                               0,     0.3,   0.7, 0, 0
                                               0,     0,     0,   1, 0" />
        </filter>
        <!-- Tritanopia: Deficiencia cono azul -->
        <filter id="tritanopia" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.95,  0.05,  0,     0, 0
                                               0,     0.433, 0.567, 0, 0
                                               0,     0.475, 0.525, 0, 0
                                               0,     0,     0,     1, 0" />
        </filter>
      </defs>
    </svg>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
